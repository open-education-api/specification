description: |
  The local selection rule for a `ProgrammeRule` node. Controls how many
  of the node's **immediate** children or parts a student must pick.

  **Scope:** local to this node only — it governs the direct children/parts
  of the enclosing `ProgrammeRule`, not the full subtree. This contrasts
  with `ConstraintSet` which validates subtree-wide aggregates.

  **`type` values**

  | type      | `unit` required | `min` required | `max` allowed | Meaning                          |
  |-----------|-----------------|----------------|---------------|----------------------------------|
  | `all`     | no              | no             | no            | Student takes every child/part   |
  | `minimum` | yes             | yes            | no            | Student takes ≥ `min` in `unit`  |
  | `range`   | yes             | yes            | yes           | `min` ≤ student pick ≤ `max`     |

  `type: all` with no `unit`/`min`/`max` is valid and common — the
  aggregate validation is then handled entirely by `constraints`.

  **`unit` values** (mirrors `ProgrammeConstraint.key`, excluding level filters)

  | unit           | sums                                          |
  |----------------|-----------------------------------------------|
  | `courses`      | count of picked items                         |
  | `ects`         | `attributes.ects` of picked items             |
  | `sbu`          | `attributes.sbu` of picked items              |
  | `contactHours` | `attributes.contactHours` of picked items     |
  | `x-{name}`     | `attributes.x-{name}` of picked items         |

type: object
required:
  - type
properties:
  type:
    type: string
    enum:
      - all
      - minimum
      - range
    description: |
      Determines how many immediate children/parts must be selected.
      - `all`     — student must take every item listed under this node.
      - `minimum` — student must accumulate at least `min` in `unit`.
      - `range`   — student must accumulate between `min` and `max` in `unit`.
    example: all
  unit:
    type: string
    enum:
      - courses
      - ects
      - sbu
      - contactHours
    pattern: '^(courses|ects|sbu|contactHours|x-[a-zA-Z][a-zA-Z0-9\-_]*)$'
    description: |
      The unit in which `min` and `max` are expressed.
      Required when `type` is `minimum` or `range`.

      Built-in units:
      - `courses`      — counts individual course picks (typically 1 per course).
      - `ects`         — sums ECTS credits of the selected items.
      - `sbu`          — sums study burden units (Dutch: studiebelastinguren).
      - `contactHours` — sums scheduled contact hours of the selected items.

      Custom units may be added with the `x-` prefix (e.g. `x-clockHours`).
      The corresponding value must be present in each `ProgrammePart.attributes`
      map for constraint evaluation to work correctly.

      Mirrors the built-in keys of `ProgrammeConstraint` (excluding `level-{N}`
      which is a filter, not a summable selection unit).
    example: ects
  min:
    type: number
    minimum: 0
    description: |
      Lower bound (inclusive) in `unit`. Required when `type` is
      `minimum` or `range`.
    example: 1
  max:
    type: number
    minimum: 0
    description: |
      Upper bound (inclusive) in `unit`. Required when `type` is `range`.
      MUST be ≥ `min`. Not applicable for `all` or `minimum`.
    example: 1
