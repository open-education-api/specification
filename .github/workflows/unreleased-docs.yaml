# This workflow publishes the unreleased Zudoku documentation from main
# to specification/unreleased in the publication repository.

name: Create and publish from main (unreleased)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-unreleased:
    runs-on: ubuntu-latest

    steps:
      # 0) Create an installation token for the publishing GitHub App.
      #    This token must be used for ALL pushes (both this repo and the publication repo).
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OEAPI_APP_PUBLISH_CLIENT_ID }}
          private-key: ${{ secrets.OEAPI_APP_PUBLISH_SECRET }}
          owner: open-education-api
          repositories: |
            specification
            open-education-api.github.io

      # 1) Checkout this repository (specification repo)
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # 2) Setup Node (latest) for running preprocess script
      - name: Setup Node (latest)
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      # 3) Mark the published specification and index as unreleased.
      - name: Set unreleased version
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const specPath = 'source/spec.yaml';
          const indexPath = 'index.mdx';
          let spec = fs.readFileSync(specPath, 'utf8');
          let index = fs.readFileSync(indexPath, 'utf8');

          const info = spec.match(/^info:\s*\r?\n((?:^[ \t]+.*\r?\n|^\s*\r?\n)*)/m);
          const versionLine = info?.[1].match(/^([ \t]+version:\s*)(["']?)([^\s"'#]+)\2(\s*(?:#.*)?)$/m);
          if (!versionLine) throw new Error('Cannot find info.version in source/spec.yaml');

          const baseVersion = versionLine[3].match(/^(\d+\.\d+)/)?.[1];
          if (!baseVersion) throw new Error(`Unexpected version: ${versionLine[3]}`);
          const version = `${baseVersion}-unreleased`;
          const updatedInfo = info[0].replace(versionLine[0],
            `${versionLine[1]}${versionLine[2]}${version}${versionLine[2]}${versionLine[4]}`);
          spec = spec.replace(info[0], updatedInfo);

          let titles = 0;
          index = index.replace(/^(\s*(?:#\s+|title:\s*["']?)OEAPI - )V?\d+\.\d+(?:-[\w.]+)?/gm,
            (_, prefix) => { titles++; return `${prefix}V${version}`; });
          if (titles !== 1) throw new Error(`Expected one OEAPI version title in index.mdx, found ${titles}`);

          for (const extension of ['json', 'yaml']) {
            const pattern = new RegExp(`\\./oeapi(?:-\\d+\\.\\d+(?:-[\\w.]+)?)?\\.${extension}\\b`, 'g');
            let links = 0;
            index = index.replace(pattern, () => { links++; return `./oeapi-${version}.${extension}`; });
            if (links !== 1) throw new Error(`Expected one ${extension} download link in index.mdx, found ${links}`);
          }

          fs.writeFileSync(specPath, spec);
          fs.writeFileSync(indexPath, index);
          NODE

      # 4-6) Bundle + preprocess + zudoku build (combined)
      - name: Build Zudoku docs (bundle + preprocess + build)
        run: |
          set -euo pipefail
          node build_oeapi.js source/spec.yaml oeapi.json oeapi.yaml oeapi.zudoku.json /specification/unreleased

      # 7) Checkout publication repository into ./target
      - name: Checkout publication repository (open-education-api.github.io)
        uses: actions/checkout@v6
        with:
          repository: open-education-api/open-education-api.github.io
          token: ${{ steps.app-token.outputs.token }}
          path: target

      # 8) Publish Zudoku build output to specification/unreleased
      - name: Publish dist -> specification/unreleased
        run: |
          set -euo pipefail
          DEST="target/specification/unreleased"
          mkdir -p "$DEST"
          rsync -a --delete "dist/specification/unreleased/" "${DEST}/"
          rsync -a --delete "source/" "${DEST}/source/"
          rsync -a oeapi-*.json oeapi-*.yaml "${DEST}/"
          mkdir -p "target/unreleased/changelog"
          rsync -a "CHANGELOG.md" "target/unreleased/changelog/"
          
      # 9) Commit and push only if there are changes in the publication repo.
      - name: Commit and push publication repo changes (if any)
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          cd target
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/open-education-api/open-education-api.github.io.git"
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish Zudoku docs (unreleased)"
            git push
          else
            echo "No changes to publish."
          fi
